steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build frontend image'
    args:
      - 'build'

      - '--file'
      - 'booking-system-frontend/Dockerfile'

      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'

      - '--build-arg'
      - 'NEXT_PUBLIC_APP_DOMAIN=${_NEXT_PUBLIC_APP_DOMAIN}'

      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME=${_NEXT_PUBLIC_AUTH_CSRF_COOKIE_NAME}'

      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_CSRF_HEADER_NAME=${_NEXT_PUBLIC_AUTH_CSRF_HEADER_NAME}'

      - '--build-arg'
      - 'NEXT_PUBLIC_TURNSTILE_SITE_KEY=${_NEXT_PUBLIC_TURNSTILE_SITE_KEY}'

      - '--build-arg'
      - 'NEXT_PUBLIC_TURNSTILE_LOGIN_ACTION=${_NEXT_PUBLIC_TURNSTILE_LOGIN_ACTION}'

      - '--build-arg'
      - 'NEXT_PUBLIC_TURNSTILE_BOOKING_ACTION=${_NEXT_PUBLIC_TURNSTILE_BOOKING_ACTION}'

      - '--build-arg'
      - 'NEXT_PUBLIC_TURNSTILE_RESCHEDULE_ACTION=${_NEXT_PUBLIC_TURNSTILE_RESCHEDULE_ACTION}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_ENABLED=${_NEXT_PUBLIC_SENTRY_ENABLED}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_ENVIRONMENT=${_NEXT_PUBLIC_SENTRY_ENVIRONMENT}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_RELEASE=${_NEXT_PUBLIC_SENTRY_RELEASE}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${_NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${_NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE}'

      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${_NEXT_PUBLIC_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE}'

      - '--tag'
      - '${_IMAGE_URI}'

      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push frontend image'
    args:
      - 'push'
      - '${_IMAGE_URI}'

images:
  - '${_IMAGE_URI}'
