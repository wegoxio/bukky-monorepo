name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bukky_ci
          POSTGRES_USER: bukky_ci
          POSTGRES_PASSWORD: bukky_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bukky_ci -d bukky_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ROLE: all
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: bukky_ci
      DB_PASSWORD: bukky_ci_password
      DB_NAME: bukky_ci
      DB_SSL: false
      JWT_SECRET: ci-jwt-secret-with-minimum-length
      JWT_REFRESH_SECRET: ci-refresh-secret-with-minimum-length
      MFA_CHALLENGE_SECRET: ci-mfa-challenge-secret-with-minimum-length
      TURNSTILE_ENABLED: false
      RUN_DB_INTEGRATION: true
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public build configuration
        shell: bash
        run: |
          [[ "${{ vars.NEXT_PUBLIC_API_URL }}" == https://*/api ]] || { echo "::error::NEXT_PUBLIC_API_URL must be an HTTPS URL ending in /api"; exit 1; }
          [[ "${{ vars.NEXT_PUBLIC_APP_DOMAIN }}" == https://* ]] || { echo "::error::NEXT_PUBLIC_APP_DOMAIN must be an HTTPS URL"; exit 1; }
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm run ci
      - name: Prepare integration database
        working-directory: booking-system-backend
        run: pnpm run migration:run
      - run: pnpm ci:test:integration:backend
      - run: pnpm ci:test:e2e:backend

  publish:
    name: Build and publish images
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      backend_operations_image: ${{ steps.names.outputs.backend_operations }}
      frontend_image: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/bukky-backend" >> "$GITHUB_OUTPUT"
          echo "backend_operations=ghcr.io/${owner}/bukky-backend-operations" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/bukky-frontend" >> "$GITHUB_OUTPUT"
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: booking-system-backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: booking-system-frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
            ${{ steps.names.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build backend operations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: booking-system-backend/Dockerfile
          target: operations
          push: true
          tags: |
            ${{ steps.names.outputs.backend_operations }}:${{ github.sha }}
            ${{ steps.names.outputs.backend_operations }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-operations

  deploy:
    name: Deploy to Lightsail
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_SMOKE_URL }}
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_SMOKE_URL }}
        shell: bash
        run: |
          for name in HOST USER SSH_KEY KNOWN_HOSTS ENV_FILE GHCR_TOKEN GHCR_USER FRONTEND_URL BACKEND_URL; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          if grep -Eiq 'replace-with|changeme|example\.com' <<< "$ENV_FILE"; then
            echo "::error::PRODUCTION_ENV_FILE contains placeholder values"
            exit 1
          fi
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/bukky
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/bukky ~/.ssh/known_hosts
      - name: Prepare release bundle
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          BACKEND_OPERATIONS_IMAGE: ${{ needs.publish.outputs.backend_operations_image }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
        shell: bash
        run: |
          cp -R ops/aws-lightsail release
          printf '%s\n' "$PRODUCTION_ENV_FILE" > release/.env.production
          sed -i '/^BACKEND_IMAGE=/d;/^BACKEND_OPERATIONS_IMAGE=/d;/^FRONTEND_IMAGE=/d;/^RELEASE_SHA=/d' release/.env.production
          printf '\nBACKEND_IMAGE=%s\nBACKEND_OPERATIONS_IMAGE=%s\nFRONTEND_IMAGE=%s\nRELEASE_SHA=%s\n' \
            "$BACKEND_IMAGE" "$BACKEND_OPERATIONS_IMAGE" "$FRONTEND_IMAGE" "$GITHUB_SHA" >> release/.env.production
          chmod +x release/*.sh
          tar -C release -czf release.tar.gz .
      - name: Upload and deploy
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          scp -i ~/.ssh/bukky release.tar.gz "${USER}@${HOST}:/tmp/bukky-release.tar.gz"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/bukky "${USER}@${HOST}" \
            "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          ssh -i ~/.ssh/bukky "${USER}@${HOST}" \
            "set -e; install -d -m 0750 /opt/bukky; tar -xzf /tmp/bukky-release.tar.gz -C /opt/bukky; rm /tmp/bukky-release.tar.gz; cd /opt/bukky; chmod 600 .env.production; ./deploy.sh '${GITHUB_SHA}'"
      - name: Public smoke tests
        env:
          FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_SMOKE_URL }}
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_SMOKE_URL }}
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$BACKEND_URL"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$FRONTEND_URL" >/dev/null
