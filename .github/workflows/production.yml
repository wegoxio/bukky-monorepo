name: Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      PRODUCTION_BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production migration gate
        run: |
          echo "Run production migrations from a controlled release procedure before deploy."
          echo "This step is intentionally informational until DB credentials and migration policy are configured in GitHub."

      - name: Deploy frontend to Vercel production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_FRONTEND_PROJECT_ID != ''
        working-directory: booking-system-frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Deploy backend to Vercel production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_BACKEND_PROJECT_ID != ''
        working-directory: booking-system-backend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Skip deploy notice
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == ''
        run: echo "Vercel production secrets are not configured yet. Quality gates passed; deploy skipped."

      - name: Smoke test production frontend
        if: env.PRODUCTION_FRONTEND_URL != ''
        run: curl --fail --show-error --silent "$PRODUCTION_FRONTEND_URL" > /dev/null

      - name: Smoke test production backend
        if: env.PRODUCTION_BACKEND_HEALTH_URL != ''
        run: curl --fail --show-error --silent "$PRODUCTION_BACKEND_HEALTH_URL" > /dev/null
