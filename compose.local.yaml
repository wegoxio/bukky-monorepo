name: bukky-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bukky
      POSTGRES_USER: bukky
      POSTGRES_PASSWORD: bukky_local
    ports:
      - '5432:5432'
    volumes:
      - bukky-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bukky -d bukky']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bukky-local-postgres:
