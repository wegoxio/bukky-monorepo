name: bukky-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    image: ${BACKEND_OPERATIONS_IMAGE}:${RELEASE_SHA}
    profiles: [operations]
    env_file: .env.production
    environment:
      APP_ROLE: api
      DB_HOST: postgres
      DB_PORT: 5432
    command: ['pnpm', 'run', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *logging

  seed-superadmin:
    image: ${BACKEND_OPERATIONS_IMAGE}:${RELEASE_SHA}
    profiles: [operations]
    env_file: .env.production
    environment:
      APP_ROLE: api
      DB_HOST: postgres
      DB_PORT: 5432
    command: ['pnpm', 'run', 'seed:superadmin']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE}:${RELEASE_SHA}
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ROLE: ${BACKEND_APP_ROLE:-all}
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    expose: ['8080']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [private]
    logging: *logging

  worker:
    image: ${BACKEND_IMAGE}:${RELEASE_SHA}
    profiles: [worker]
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ROLE: worker
      REMINDERS_SCHEDULER_ENABLED: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE}:${RELEASE_SHA}
    restart: unless-stopped
    environment:
      PORT: 8080
      HOSTNAME: 0.0.0.0
    expose: ['8080']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [private]
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [private]
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  private:
    driver: bridge
