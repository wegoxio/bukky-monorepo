name: Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      STAGING_BACKEND_HEALTH_URL: ${{ vars.STAGING_BACKEND_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy frontend to Vercel preview
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_FRONTEND_PROJECT_ID != ''
        working-directory: booking-system-frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN"

      - name: Deploy backend to Vercel preview
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_BACKEND_PROJECT_ID != ''
        working-directory: booking-system-backend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN"

      - name: Skip deploy notice
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == ''
        run: echo "Vercel staging secrets are not configured yet. Quality gates passed; deploy skipped."

      - name: Smoke test staging frontend
        if: env.STAGING_FRONTEND_URL != ''
        run: curl --fail --show-error --silent "$STAGING_FRONTEND_URL" > /dev/null

      - name: Smoke test staging backend
        if: env.STAGING_BACKEND_HEALTH_URL != ''
        run: curl --fail --show-error --silent "$STAGING_BACKEND_HEALTH_URL" > /dev/null
